name : Despliegue infra IaC
on:
  workflow_dispatch:
     inputs:
      environment:
        description: Ambiente
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
  workflow_call: 
    inputs:
      environment:
        required: true
        type: string
  pull_request: 
    branches:
      - main
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
jobs:
  deploy:
    name: Terraform settings
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{inputs.environment}}
      ARM_CLIENT_ID: ${{secrets.AZURE_AD_CLIENT_ID}}
      ARM_CLIENT_SECRET: ${{secrets.AZURE_AD_CLIENT_SECRET}}
      ARM_SUBSCRIPTION_ID: ${{secrets.AZURE_SUSCRIPTION_ID}}
      ARM_TENANT_ID: ${{secrets.AZURE_AD_TENANT_ID}}
    steps:
      - name: Validar el repositorio
        uses: actions/checkout@v6.1.0

      - name: Setup
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform init
        run: terraform init -backend-config="sas_token=${{secrets.SAS_TOKEN}}" -backend-config="backend/${ENVIRONMENT}.tf"
        working-directory: infra

      - name: Validacion terraform
        run: terraform validate
        working-directory: infra

      - name: terraform plan
        run: terraform plan -var-file="environments/${ENVIRONMENT}.tfvars" -out=tfplan
        working-directory: infra

      - name: Security Scan
        run: |
          curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
          tfsec . 

      - name: terraform apply
        if: github.event_name == 'push'
        run: terraform apply -var-file="environments/${ENVIRONMENT}.tfvars" -auto-approve tfplan
        working-directory: infra
