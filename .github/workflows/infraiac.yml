name : Despliegue infra IaC
on:
  push:
    branches: ["main"]
jobs:
  deploy:
    name: Terraform settings
    runs-on: ubuntu-latest
    steps:
      - name: Validar el repositorio
        uses: actions/checkout@v4

      - name: Setup
        uses: hashicorp/setup-terraform@v3
        
      - name: Terraform version
        run: terraform version
