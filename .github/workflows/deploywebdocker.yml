name: Docker image web
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  deploy:
    name: Docker build
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      APP_NAME: paginapruebadevsecops-${{ inputs.environment || 'dev' }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build website
        run: |
          docker build \
          --platform linux \
          --tag devsecopspruebas/webserver:${ENVIRONMENT} \
          -f src/Dockerfile .
      - name: Escaneo de vulnerabilidades
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecopspruebas/webserver:${{ env.ENVIRONMENT }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Publicar imagen
        if: github.event_name != 'pull_request'
        run: |
          docker push devsecopspruebas/webserver:${ENVIRONMENT}

      - name: Deploy App Service
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PROFILE }}
          images: 'devsecopspruebas/webserver:${{ env.ENVIRONMENT }}'
